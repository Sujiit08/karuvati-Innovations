<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karuvati Innovations — Intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;color:#cfd8ff;font-family:Sora,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
#root{height:100%}
.intro{position:fixed;inset:0;background:#000;z-index:50}
.intro canvas{width:100%;height:100%;display:block}
.skip{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;padding:8px 16px;font:400 12px Sora,sans-serif;letter-spacing:.12em;color:rgba(200,215,255,.75);background:rgba(255,255,255,.04);border:1px solid rgba(140,170,255,.25);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.skip:hover,.skip:focus-visible{color:#fff;border-color:rgba(140,200,255,.7);background:rgba(120,140,255,.14);outline:none}
.home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#0b1030 0%,#000 70%);animation:in 1.2s ease both}
.home p{margin:0;font-size:14px;letter-spacing:.2em;color:rgba(190,205,255,.6)}
.home button{padding:8px 18px;border-radius:999px;border:1px solid rgba(140,170,255,.3);background:transparent;color:#cfd8ff;font:400 12px Sora,sans-serif;letter-spacing:.1em;cursor:pointer}
.home button:hover,.home button:focus-visible{border-color:#7fd6ff;outline:none}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.home{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef}=React, h=React.createElement;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eo=t=>1-Math.pow(1-t,3);
const FONT='Sora,"Segoe UI",Helvetica,Arial,sans-serif';

function layout(w,hh){const fs=Math.min(w*.085,130);return{fs,sp:fs*.12,y1:hh/2-fs*.55,y2:hh/2+fs*.62,ty:hh/2+fs*1.75}}
function drawWords(c,w,L,fill){c.textAlign='center';c.textBaseline='middle';c.font=`700 ${L.fs}px ${FONT}`;c.letterSpacing=L.sp+'px';c.fillStyle=fill;c.fillText('KARUVATI',w/2+L.sp/2,L.y1);c.fillText('INNOVATIONS',w/2+L.sp/2,L.y2)}
function drawKI(c,w,hh){c.textAlign='center';c.textBaseline='middle';c.font=`800 ${Math.min(w*.32,hh*.5)}px ${FONT}`;c.letterSpacing='0px';c.fillStyle='#fff';c.fillText('KI',w/2,hh/2)}
function sample(draw,w,hh,N){
  const o=document.createElement('canvas');o.width=w;o.height=hh;
  const c=o.getContext('2d',{willReadFrequently:true});draw(c);
  const d=c.getImageData(0,0,w,hh).data,pts=[];
  for(let y=0;y<hh;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>128)pts.push([x,y]);
  for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
  const out=[];for(let i=0;i<N;i++){const p=pts[i%pts.length]||[w/2,hh/2];out.push([p[0]+(Math.random()-.5)*2,p[1]+(Math.random()-.5)*2])}
  return out.sort((a,b)=>a[0]-b[0]);
}

function KaruvatiIntro({onComplete}){
  const cv=useRef(),box=useRef(),skip=useRef(false);
  useEffect(()=>{
    let raf,dead=false;
    (async()=>{
      try{await Promise.race([document.fonts.load('800 100px Sora'),document.fonts.load('700 100px Sora'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
      if(dead)return;
      const w=Math.floor(innerWidth),hh=Math.floor(innerHeight),dpr=Math.min(devicePixelRatio||1,2);
      const c=cv.current;c.width=w*dpr;c.height=hh*dpr;const g=c.getContext('2d');
      const N=w<600?1500:2800,L=layout(w,hh);
      const A=sample(c2=>drawKI(c2,w,hh),w,hh,N),B=sample(c2=>drawWords(c2,w,L,'#fff'),w,hh,N);
      const cols=['#5cf0ff','#4d7cff','#a35cff'];
      const P=Array.from({length:N},(_,i)=>{const a=Math.random()*6.283,r=60+Math.random()*Math.min(w,hh)*.6;
        return{sx:w/2+Math.cos(a)*r,sy:hh/2+Math.sin(a)*r*.7,ax:A[i][0],ay:A[i][1],bx:B[i][0],by:B[i][1],
          d1:Math.random()*.5,d2:Math.random()*.6,d3:i/N*.45,sw:(Math.random()-.5)*160,s:1+Math.random()*1.7,al:Math.random(),k:Math.random()*3|0}});
      const dust=Array.from({length:110},()=>({x:Math.random()*w,y:Math.random()*hh,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,s:.6+Math.random()*1.4,k:Math.random()*3|0}));
      g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);
      const t0=performance.now();let skipT=null,last=t0;
      const frame=now=>{
        if(dead)return;
        const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
        if(skip.current&&skipT==null)skipT=t;
        const fs_=skipT==null?0:clamp((t-skipT)/.5);
        box.current.style.opacity=skipT!=null?1-fs_:1-clamp((t-7.0)/.9);
        if(fs_>=1||t>7.95){onComplete();return}
        g.setTransform(dpr,0,0,dpr,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;
        g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,w,hh);
        // camera
        let z=1+.25*eio(clamp((t-3.2)/.9))-.25*eio(clamp((t-4.1)/1.5))+.04*clamp((t-5.6)/1);
        if(t>6.6)z*=Math.pow(14,eio(clamp((t-6.6)/1.3)));
        g.translate(w/2,hh/2);g.scale(z,z);g.translate(-w/2,-hh/2);
        g.globalCompositeOperation='lighter';
        // background dust
        const da=clamp((t-.9)/1.5)*.35;
        for(let k=0;k<3;k++){g.fillStyle=cols[k];g.globalAlpha=da;for(const d of dust){if(d.k!==k)continue;d.x=(d.x+d.vx*dt+w)%w;d.y=(d.y+d.vy*dt+hh)%hh;g.fillRect(d.x,d.y,d.s,d.s)}}
        // seed particle
        if(t>.6){const a=clamp((t-.6)/.4)*(1-clamp((t-1.6)/.6));if(a>0){const r=14+10*Math.sin(t*9),gr=g.createRadialGradient(w/2,hh/2,0,w/2,hh/2,r*2.2);
          gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(90,190,255,.8)');gr.addColorStop(1,'rgba(40,80,255,0)');g.globalAlpha=a;g.fillStyle=gr;g.fillRect(w/2-r*3,hh/2-r*3,r*6,r*6)}}
        // KI glow
        const glow=eio(clamp((t-3.3)/.4))*(1-clamp((t-4.1)/.5));
        if(glow>0){const gr=g.createRadialGradient(w/2,hh/2,0,w/2,hh/2,Math.min(w,hh)*.5);gr.addColorStop(0,'rgba(110,120,255,.35)');gr.addColorStop(.6,'rgba(150,70,255,.12)');gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=glow;g.fillStyle=gr;g.fillRect(0,0,w,hh)}
        // brand glow
        const ga=eio(clamp((t-5.0)/.8));
        if(ga>0){g.save();g.translate(w/2,hh/2);g.scale(1,.45);const gr=g.createRadialGradient(0,0,0,0,0,w*.45);gr.addColorStop(0,'rgba(80,140,255,.35)');gr.addColorStop(.5,'rgba(150,70,255,.16)');gr.addColorStop(1,'rgba(0,200,255,0)');g.globalAlpha=ga;g.fillStyle=gr;g.fillRect(-w,-w,w*2,w*2);g.restore()}
        // particles
        const sweepX=w*(-.2+1.4*clamp((t-3.5)/.9)),sweeping=t>3.4&&t<4.6;
        for(let k=0;k<3;k++){g.fillStyle=cols[k];
          for(const p of P){if(p.k!==k)continue;
            const e1=eo(clamp((t-.7-p.d1)/1.3));if(e1<=0)continue;
            const e2=eio(clamp((t-1.6-p.d2)/1.9)),q=clamp((t-4.1-p.d3)/1.5),e3=eio(q);
            let x=w/2+(p.sx-w/2)*e1,y=hh/2+(p.sy-hh/2)*e1;
            x+=(p.ax-x)*e2;y+=(p.ay-y)*e2;
            const sw=Math.sin(Math.PI*e2),sq=Math.sin(Math.PI*q);
            x+=sw*p.sw*.5;y+=sw*p.sw*.5;
            x+=(p.bx-x)*e3+(p.ax-w/2)*.35*sq;y+=(p.by-y)*e3+sq*p.sw*1.2;
            const bo=sweeping?Math.exp(-(((x-sweepX)/90)**2)):0;
            const shimmer=t>5.5?.15*Math.sin(t*3+p.al*20):0;
            g.globalAlpha=Math.min(1,(.45+.5*p.al+glow*.4+shimmer)*Math.min(1,e1*2)+bo*.8);
            const s=p.s*(1+bo*1.8+glow*.6);g.fillRect(x,y,s,s)}}
        // light beam through brand
        if(t>5.5&&t<6.8){const bx=w*(-.2+1.4*clamp((t-5.5)/1.2));g.save();g.translate(bx,hh/2);g.rotate(.35);
          const gr=g.createLinearGradient(-90,0,90,0);gr.addColorStop(0,'rgba(120,180,255,0)');gr.addColorStop(.5,'rgba(190,220,255,.4)');gr.addColorStop(1,'rgba(120,180,255,0)');
          g.globalAlpha=1;g.fillStyle=gr;g.fillRect(-90,-hh,180,hh*2);g.restore()}
        // crisp type
        g.globalCompositeOperation='source-over';
        const ta=eio(clamp((t-5.5)/.8));
        if(ta>0){g.globalAlpha=ta;g.shadowColor='#6aa8ff';g.shadowBlur=26;drawWords(g,w,L,'#f4f8ff');g.shadowBlur=0;
          const tg=clamp((t-5.9)/.7);g.globalAlpha=tg*.9;g.font=`400 ${L.fs*.19}px ${FONT}`;g.letterSpacing=L.fs*.085+'px';g.fillStyle='#a9c4ff';
          g.fillText('INNOVATING DIGITAL EXPERIENCES',w/2+L.fs*.04,L.ty)}
        raf=requestAnimationFrame(frame);
      };
      raf=requestAnimationFrame(frame);
    })();
    return()=>{dead=true;cancelAnimationFrame(raf)};
  },[]);
  return h('div',{className:'intro',ref:box,'aria-label':'Karuvati Innovations intro'},
    h('canvas',{ref:cv}),
    h('button',{className:'skip',onClick:()=>{skip.current=true}},'Skip Intro'));
}

function App(){
  const [done,setDone] = useState(false);

  useEffect(() => {
    if(done){
      window.location.href = "home.html";
    }
  }, [done]);

  return h(
    React.Fragment,
    null,
    !done && h(KaruvatiIntro, {
      onComplete: () => setDone(true)
    })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
